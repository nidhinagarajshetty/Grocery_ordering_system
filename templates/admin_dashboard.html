<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #f2f6ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            color: #4b0082;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-add {
            background-color: #4CAF50;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-add:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background-color: white;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        th {
            background-color: #6a5acd;
            color: white;
            padding: 12px;
            font-size: 18px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1ff;
        }

        a {
            text-decoration: none;
            color: #6a5acd;
            font-weight: bold;
        }

        a:hover {
            color: #836fff;
        }

        .logout {
            float: right;
            background-color: #ff5555;
            padding: 8px 15px;
            color: white;
            border-radius: 8px;
        }

        .logout:hover {
            background-color: #ff7777;
        }
    </style>
</head>
<body>

    <a href="/admin/logout" class="logout">Logout</a>

    <h2>Admin Dashboard</h2>

    <a href="/admin/add" class="btn-add">+ Add New Product</a>

    <table>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>

        {% for name, item in items.items() %}
        <tr>
            <td>{{ name }}</td>
            <td>{{ item.price }}</td>
            <td>{{ item.category }}</td>
            <td>
                <a href="/admin/edit/{{ name }}">Edit</a> |
                <a href="/admin/delete/{{ name }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
