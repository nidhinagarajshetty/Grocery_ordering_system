<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 30px;
        }
        .container {
            width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px grey;
        }
        h2 {
            text-align: center;
        }
        .total-box {
            background: #eee;
            padding: 10px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 18px;
        }
        .pay-btn {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .pay-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Payment Page</h2>

    <div class="total-box">
        <b>Total Amount:</b> ₹{{ total }}
    </div>

    <!-- ⭐ IMPORTANT — Correct form action -->
    <form action="{{ url_for('payment_done') }}" method="POST">

        <label><b>Select Payment Method:</b></label><br><br>

        <input type="radio" name="payment_method" value="Cash on Delivery" required>
        Cash on Delivery<br><br>

        <input type="radio" name="payment_method" value="UPI" required>
        UPI<br><br>

        <input type="radio" name="payment_method" value="Card Payment" required>
        Card Payment<br><br>

        <button type="submit" class="pay-btn">Pay Now</button>

    </form>
</div>

</body>
</html>
