<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing - Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffeedd;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 70px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .total {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #444;
        }

        label {
            font-size: 18px;
            font-weight: bold;
        }

        .payment-option {
            margin: 10px 0;
            font-size: 17px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff8800;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #ff7700;
        }
    </style>

    <script>
        function showAlert() {
            alert("Payment Successful ✔️\nThank you for your order!");
        }
    </script>

</head>
<body>

<div class="container">
    <h2>Complete Your Payment</h2>

    <div class="total">Total Amount: ₹{{ total }}</div>

    <!-- BILLING / PAYMENT FORM -->
    <form id="payForm" action="/payment_done" method="POST" onsubmit="showAlert()">

        <label>Select Payment Method:</label><br><br>

        <div class="payment-option">
            <input type="radio" name="payment_method" value="UPI" checked>
            UPI (GPay / PhonePe)
        </div>

        <div class="payment-option">
            <input type="radio" name="payment_method" value="Debit Card">
            Debit Card
        </div>

        <div class="payment-option">
            <input type="radio" name="payment_method" value="Credit Card">
            Credit Card
        </div>

        <div class="payment-option">
            <input type="radio" name="payment_method" value="NetBanking">
            NetBanking
        </div>

        <button type="submit">Pay Now</button>

    </form>

</div>

</body>
</html>
