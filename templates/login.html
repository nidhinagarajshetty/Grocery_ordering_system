<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family:  Arial, sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            animation: fadeIn 0.4s ease-in-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 20px;
            color: #0083b0;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #888;
            outline: none;
            transition: 0.3s;
            font-size: 16px;
        }

        input:focus {
            border-color: #0083b0;
            box-shadow: 0 0 5px #00b4db;
        }

        button {
            width: 95%;
            padding: 12px;
            font-size: 17px;
            background: #0083b0;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00a1ce;
        }

        a {
            text-decoration: none;
            color: #0083b0;
        }

        .message {
            color: red;
            margin-bottom: 10px;
            font-size: 15px;
        }
    </style>

</head>
<body>

<div class="card">
    <h2>Login</h2>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Enter your Username" required>
        <button type="submit">Login</button>
    </form>

    <p style="margin-top: 12px;">New user? <a href="/signup">Create account</a></p>
</div>

</body>
</html>
